<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  color-scheme:dark;
  --bg:#0a0b0d; --surface:#121316; --surface2:#1a1b1f; --border:#23252a;
  --text:#ececee; --muted:#8b8f98;
  --accent:#3ddc84; --on-accent:#04210f;
  --overlay:rgba(10,11,13,.97);
  --shadow:none; --chip:transparent;
  --tint-bg:var(--accent); --tint-text:var(--on-accent); --tint-border:var(--accent);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e3e7ed; --surface:#eceff4; --surface2:#d6dbe3; --border:#cdd3dc;
  --text:#2a313c; --muted:#566172;
  --accent:#2b8a57; --on-accent:#fff;
  --overlay:rgba(227,231,237,.98);
  --shadow:0 8px 22px rgba(60,72,96,.18);
  --chip:rgba(255,255,255,.35);
  --tint-bg:#cfe6da; --tint-text:#1f6b43; --tint-border:#a3cdb5;
}

[hidden]{display:none!important}

html{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  scroll-padding-top:calc(56px + var(--safe-top));
}
body{
  position:relative;background:var(--bg);min-height:100dvh;overflow-x:hidden;
  padding-top:var(--safe-top);padding-bottom:calc(32px + var(--safe-bot));
}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

html.theme-anim,html.theme-anim *{transition:background-color .3s,color .3s,border-color .3s!important}

.site-header{
  position:sticky;top:0;z-index:100;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px 0 20px;background:var(--bg);border-bottom:1px solid var(--border);
}
.site-logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;letter-spacing:-.5px;color:var(--text);transition:transform .12s}
.site-logo:active{transform:scale(.96)}
.site-logo b{font-weight:400;color:var(--muted)}
.logo-mark{width:30px;height:30px;flex-shrink:0;margin-right:2px;border-radius:8px;object-fit:contain}
.apk-badge{
  font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 6px;border-radius:6px;
  background:var(--tint-bg);color:var(--tint-text);border:1px solid var(--tint-border);
}
.header-actions{display:flex;gap:2px}
.icon-btn{
  width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:50%;
  color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.icon-btn:active{background:var(--surface2);color:var(--text)}
[data-theme="dark"] .icon-moon,[data-theme="light"] .icon-sun{display:none}

.search-overlay{
  position:fixed;inset:0;background:var(--overlay);z-index:200;
  padding:calc(var(--safe-top) + 14px) 20px 20px;display:flex;flex-direction:column;gap:18px;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px);
  transition:opacity .2s ease,transform .2s ease,visibility 0s .2s;
}
.search-overlay.open{opacity:1;visibility:visible;pointer-events:all;transform:none;transition-delay:0s}
.search-top{display:flex;align-items:center;gap:12px}
.search-input-wrap{
  flex:1;display:flex;align-items:center;gap:10px;background:var(--surface2);
  border:1px solid var(--border);border-radius:12px;padding:0 14px;
}
.search-input-wrap svg{color:var(--muted);flex-shrink:0}
.search-input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px;padding:13px 0}
.search-input::placeholder{color:var(--muted)}
.search-cancel{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:8px 0;white-space:nowrap}
.search-results-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.search-result-row{
  display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);
  font-size:15px;color:var(--text);
}
.search-result-row:last-child{border-bottom:0}
.search-result-row svg{color:var(--muted);flex-shrink:0}
.search-empty-state{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}

.category-nav{display:flex;gap:8px;padding:16px 20px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.category-nav::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;padding:8px 18px;border-radius:100px;font-size:13px;font-weight:500;cursor:pointer;
  border:1px solid var(--border);background:var(--chip);color:var(--muted);white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .2s,color .2s,border-color .2s,transform .12s;
}
.pill:active{transform:scale(.95)}
.pill.active{background:var(--tint-bg);color:var(--tint-text);border-color:var(--tint-border);font-weight:600}

.label{
  font-size:11px;letter-spacing:1.8px;color:var(--muted);padding:0 20px;margin-bottom:14px;
  text-transform:uppercase;font-weight:600;
}
.label::before{
  content:"";display:inline-block;width:3px;height:11px;margin-right:8px;vertical-align:-1px;
  background:var(--accent);border-radius:2px;
}

.featured-zone{padding:4px 20px 44px}
.featured-card{
  position:relative;display:block;border-radius:16px;overflow:hidden;
  background:var(--surface);aspect-ratio:16/9;box-shadow:var(--shadow);
}
.featured-card img{width:100%;height:100%;object-fit:cover}
.featured-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.3) 50%,transparent 100%)}
.featured-info{position:absolute;left:0;right:0;bottom:0;padding:20px 18px 18px}
.featured-eyebrow{font-size:10px;letter-spacing:2.5px;color:#3ddc84;text-transform:uppercase;margin-bottom:5px;font-weight:700}
.featured-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.5px;line-height:1.1}

.scroll-section,.mosaic-section{
  margin-bottom:44px;scroll-margin-top:72px;
  content-visibility:auto;contain-intrinsic-size:auto 260px;
}
.scroll-row{
  display:flex;gap:12px;padding:0 20px;overflow-x:auto;
  scroll-snap-type:x mandatory;scroll-padding-inline:20px;
  overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.scroll-row::-webkit-scrollbar{display:none}

.g-card{flex-shrink:0;width:120px;scroll-snap-align:start;display:block}
.g-card-thumb{
  position:relative;width:120px;height:160px;border-radius:10px;overflow:hidden;
  background:var(--surface);margin-bottom:9px;transition:transform .12s;
}
.g-card-thumb img{width:100%;height:100%;object-fit:cover}
.g-card:active .g-card-thumb{transform:scale(.97)}
.g-card-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}

.mosaic-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:112px;gap:10px;padding:0 20px}
.m-card{position:relative;display:block;border-radius:12px;overflow:hidden;background:var(--surface);transition:transform .12s}
.m-card:active{transform:scale(.97)}
.m-card.tall{grid-row:span 2}
.m-card img{width:100%;height:100%;object-fit:cover}
.m-card-title{
  position:absolute;left:0;right:0;bottom:0;padding:10px 10px 8px;
  background:linear-gradient(to top,rgba(0,0,0,.85),transparent);
  font-size:11px;font-weight:600;color:#fff;line-height:1.2;
}
.g-card-thumb::after,.m-card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.2);
}

.top-sentinel{position:absolute;top:480px;left:0;width:1px;height:1px;pointer-events:none}
.to-top{
  position:fixed;right:16px;bottom:calc(20px + var(--safe-bot));z-index:90;width:44px;height:44px;
  display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--accent);box-shadow:var(--shadow);cursor:pointer;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s;
  -webkit-tap-highlight-color:transparent;
}
.to-top.show{opacity:1;transform:none;pointer-events:auto}

.site-footer{padding:24px 20px;text-align:center;font-size:12px;color:var(--muted);border-top:1px solid var(--border);letter-spacing:.3px}

.g-card-thumb img,.m-card img{opacity:0;transition:opacity .4s ease}
.g-card-thumb img.ld,.m-card img.ld{opacity:1}
@keyframes tpop{from{transform:rotate(-80deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
html.theme-anim #themeBtn svg{animation:tpop .4s ease}
@media (min-width:768px){
  .site-header{padding-left:max(20px,calc((100% - 1100px)/2 + 20px));padding-right:max(12px,calc((100% - 1100px)/2 + 12px))}
  .category-nav,main{max-width:1100px;margin-inline:auto}
  .featured-card{aspect-ratio:21/9;max-height:340px}
  .featured-info{padding:28px 28px 24px}
  .featured-title{font-size:32px}
  .scroll-row{flex-wrap:wrap;overflow:visible;gap:16px 14px}
  .g-card,.g-card-thumb{width:150px}
  .g-card-thumb{height:200px}
  .g-card-name{font-size:13px}
  .mosaic-grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;grid-auto-flow:dense;gap:14px}
  .m-card-title{font-size:13px;padding:14px 12px 10px}
  .search-overlay{padding-top:48px}
  .search-top,.search-results-list{width:100%;max-width:640px;margin-inline:auto}
}
@media (hover:hover){
  .g-card:hover .g-card-thumb,.m-card:hover{transform:translateY(-3px)}
  .pill:not(.active):hover{color:var(--text)}
  .icon-btn:hover{background:var(--surface2);color:var(--text)}
  .to-top.show:hover{transform:translateY(-2px)}
}

/* PC redirect overlay */
.pc-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.82);
  display:flex;align-items:center;justify-content:center;
  padding:24px;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .25s ease,visibility 0s .25s;
}
.pc-overlay.show{opacity:1;visibility:visible;pointer-events:all;transition-delay:0s}
.pc-dialog{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:28px 24px 22px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  transform:scale(.94) translateY(8px);
  transition:transform .25s ease;
}
.pc-overlay.show .pc-dialog{transform:none}
.pc-dialog p{
  font-size:15px;line-height:1.55;color:var(--text);margin-bottom:22px;
}
.pc-btns{display:flex;gap:12px;justify-content:center}
.pc-btn{
  flex:1;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:600;
  border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .12s,filter .15s,background .15s;
}
.pc-btn:active{transform:scale(.97)}
.pc-btn-yes{background:#3ddc84;color:#04210f}
.pc-btn-no{background:#e74c3c;color:#fff}
@media (hover:hover){
  .pc-btn-yes:hover{filter:brightness(1.08)}
  .pc-btn-no:hover{filter:brightness(1.1)}
}
</style>
</head>
<body>

<header class="site-header">
  <a class="site-logo" id="logo" href="/apk/" aria-label="BallasNet APK ana sayfa">
    <img class="logo-mark" src="apklogo.webp" alt="" width="30" height="30" decoding="async" data-fb="1">

      <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

<script>
const FEATURED = "worldbox";
const MIX_COUNT = 12;
const FALLBACK = "images/fallback.jpg";

const GAMES = [
  { title: "WorldBox", slug: "worldbox", img: "https://ballasnet.com/oyunindir/worldbox/worldbox.webp", tags: ["Popüler","Indie"] }
];

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href = g => g.url || `/apk/${g.slug}/`;

let rafId = 0;
function scrollToY(getY, done) {
  cancelAnimationFrame(rafId);
  const from = scrollY, t0 = performance.now(), gap = Math.abs(getY() - from);
  if (gap < 2) { if (done) done(); return; }
  const dur = Math.min(700, 350 + gap * 0.12);
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    const t = Math.min(1, Math.max(0, (now - t0) / dur));
    scrollTo(0, from + (getY() - from) * ease(t));
    if (t < 1) rafId = requestAnimationFrame(step); else if (done) done();
  };
  rafId = requestAnimationFrame(step);
}
['touchstart', 'wheel'].forEach(ev => addEventListener(ev, () => cancelAnimationFrame(rafId), { passive: true }));

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

document.addEventListener('error', e => {
  const t = e.target;
  if (t.tagName === 'IMG' && !t.dataset.fb) { t.dataset.fb = 1; t.src = FALLBACK; }
}, true);
document.addEventListener('load', e => { if (e.target.tagName === 'IMG') e.target.classList.add('ld'); }, true);

const card = g =>
  `<a class="g-card" href="${href(g)}"><div class="g-card-thumb"><img src="${g.img}" alt="${esc(g.title)}" width="120" height="160" loading="lazy" decoding="async"></div><div class="g-card-name">${esc(g.title)}</div></a>`;
const mosaic = (g, i) =>
  `<a class="m-card${i % 5 === 0 ? ' tall' : ''}" href="${href(g)}"><img src="${g.img}" alt="${esc(g.title)}" width="240" height="224" loading="lazy" decoding="async"><div class="m-card-title">${esc(g.title)}</div></a>`;

const f = GAMES.find(g => g.slug === FEATURED) || GAMES[0];
if (f) {
  $('featuredCard').href = href(f);
  const img = $('featuredImg');
  img.alt = f.title;
  img.src = f.img;
  $('featuredTitle').textContent = f.title;
} else {
  $('featuredZone').hidden = true;
}

[
  ['populer', GAMES.filter(g => g.tags.includes('Popüler')), 'populer-row', card],
  ['karisik', shuffle(GAMES).slice(0, MIX_COUNT),            'karisik-row', card],
  ['indie',   GAMES.filter(g => g.tags.includes('Indie')),   'indie-grid',  mosaic]
].forEach(([name, list, box, tpl]) => {
  if (!list.length) {
    $('section-' + name).hidden = true;
    document.querySelector(`.pill[data-target="section-${name}"]`).hidden = true;
    return;
  }
  $(box).innerHTML = list.map(tpl).join('');
});

const pills = [...document.querySelectorAll('.pill')];
pills.forEach(p => p.classList.remove('active'));
const first = pills.find(p => !p.hidden);
if (first) first.classList.add('active');

pills.forEach(p => p.addEventListener('click', () => {
  pills.forEach(x => x.classList.remove('active'));
  p.classList.add('active');
  const el = $(p.dataset.target);
  scrollToY(() => el.getBoundingClientRect().top + scrollY - 72);
}));

$('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.dataset.theme === 'light' ? 'dark' : 'light';
  root.classList.add('theme-anim');
  root.dataset.theme = next;
  document.querySelector('meta[name=theme-color]').content = next === 'light' ? '#e3e7ed' : '#0a0b0d';
  try { localStorage.setItem('theme', next); } catch (e) {}
  setTimeout(() => root.classList.remove('theme-anim'), 350);
});

const toTop = $('toTop');
toTop.addEventListener('click', () => scrollToY(() => 0));

$('logo').addEventListener('click', e => {
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  scrollToY(() => 0, () => location.reload());
});
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([e]) => {
    toTop.classList.toggle('show', !e.isIntersecting && e.boundingClientRect.top < 0);
  }).observe($('topSentinel'));
} else {
  toTop.classList.add('show');
}

(function () {
  const overlay = $('searchOverlay'), input = $('searchInput'), list = $('searchResults');
  const open = () => {
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(() => input.focus(), 60);
  };
  const close = () => {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    input.value = '';
    list.innerHTML = '';
  };
  $('searchOpenBtn').addEventListener('click', open);
  $('searchCloseBtn').addEventListener('click', close);
  input.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { list.innerHTML = ''; return; }
    const hits = GAMES.filter(g => g.title.toLowerCase().includes(q));
    list.innerHTML = hits.length
      ? hits.map(g => `<a class="search-result-row" href="${href(g)}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>${esc(g.title)}</a>`).join('')
      : '<div class="search-empty-state">Sonuç yok.</div>';
  });
})();

/* PC algılama ve yönlendirme overlay — sadece masaüstünde */
(function () {
  const isPC = () => {
    const ua = navigator.userAgent || '';
    const mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Tablet/i.test(ua);
    const coarse = window.matchMedia('(pointer: coarse)').matches;
    const narrow = window.matchMedia('(max-width: 768px)').matches;
    // Mobil/tablet değilse ve geniş ekran + ince pointer ise PC kabul et
    return !mobileUA && !coarse && !narrow;
  };

  if (!isPC()) return;

  const overlay = $('pcOverlay');
  const dialog = overlay.querySelector('.pc-dialog');
  const show = () => {
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  };
  const hide = () => {
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  };

  $('pcYes').addEventListener('click', () => { location.href = 'https://ballasnet.com'; });
  $('pcNo').addEventListener('click', hide);
  overlay.addEventListener('click', e => { if (e.target === overlay) hide(); });
  dialog.addEventListener('click', e => e.stopPropagation());

  // Sayfa yüklenince göster
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', show);
  } else {
    show();
  }
})();
</script>
